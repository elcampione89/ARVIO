name: Build web app (panel mode)

# Builds the ARVIO web app connected to your ARVIO panel and publishes it as
# ghcr.io/<owner>/arvio-web:latest for the VPS to pull. See web/deploy/panel/README.md.
on:
  push:
    branches: [panel-v2]
    paths: ['web/**', '.github/workflows/web-panel.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-panel-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: panel-v2

      - name: Image name
        id: name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/arvio-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile.panel
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=ARVIO web (panel)
          cache-from: type=gha
          cache-to: type=gha,mode=max
