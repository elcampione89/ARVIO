name: Build APK Release

on:
  push:
    branches: [panel-v2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-panel-v2
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: panel-v2
          fetch-depth: 0

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)/\1/p' app/build.gradle.kts | head -n 1)"
          commit_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "Unable to read versionName/versionCode from app/build.gradle.kts" >&2
            exit 1
          fi
          {
            echo "name=$version_name"
            echo "code=$version_code"
            echo "sha=$commit_sha"
            echo "short_sha=$short_sha"
            echo "tag=arvio-v2-$version_name-$short_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check release tag
        id: release
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$tag already exists; APK will be retained as a workflow artifact only."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          # Every APK must be signed with the same key, or Android refuses to
          # install it as an update. Without these secrets the build fails
          # rather than silently shipping a throwaway debug signature.
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Missing RELEASE_KEYSTORE_BASE64 secret; refusing to build an unsigned-for-release APK." >&2
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$RELEASE_KEYSTORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleSideloadRelease --no-daemon

      - name: Verify universal ABI coverage
        shell: bash
        run: |
          apk="app/build/outputs/apk/sideload/release/app-sideload-release.apk"
          unzip -l "$apk" > "$RUNNER_TEMP/arvio-apk-entries.txt"
          # ARM covers Fire TV, Android TV boxes and phones. x86 is only added
          # with -PincludeX86Abis=true for emulators, so it is not required here.
          for abi in armeabi-v7a arm64-v8a; do
            grep -q "lib/$abi/" "$RUNNER_TEMP/arvio-apk-entries.txt" || {
              echo "Universal APK is missing ABI: $abi" >&2
              exit 1
            }
          done

      - name: Collect release APK
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/sideload/release/app-sideload-release.apk \
            "release-artifacts/ARVIO-${{ steps.version.outputs.name }}-${{ steps.version.outputs.short_sha }}-universal.apk"

      - name: Make Firestick (32-bit ARM) APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          bash .github/scripts/make-arm32-apk.sh \
            "release-artifacts/ARVIO-${{ steps.version.outputs.name }}-${{ steps.version.outputs.short_sha }}-universal.apk" \
            "release-artifacts/ARVIO-${{ steps.version.outputs.name }}-${{ steps.version.outputs.short_sha }}-firestick-arm32.apk"
          (cd release-artifacts && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARVIO-${{ steps.version.outputs.name }}-${{ steps.version.outputs.short_sha }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Create version release
        if: steps.release.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.ARVIO_RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            release-artifacts/* \
            --target "${{ steps.version.outputs.sha }}" \
            --title "Arvio v2 ${{ steps.version.outputs.name }} (${{ steps.version.outputs.short_sha }})" \
            --generate-notes \
            --latest
